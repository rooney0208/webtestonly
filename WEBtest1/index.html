<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">Student<span>Hub</span></div>

        <nav>
            <a href="#home">Home</a>
            <a href="#tasks">Tugas</a>
            <a href="#calculator">Nilai</a>
        </nav>

        <button id="themeBtn">🌙</button>
    </header>

    <main>

        <section id="home" class="hero">
            <div>
                <p class="small">WELCOME TO</p>
                <h1>Student Hub 👋</h1>
                <p>
                    Website sederhana untuk membantu kamu mengatur
                    tugas dan mengecek nilai.
                </p>

                <button class="primary" onclick="scrollToTasks()">
                    Lihat Tugas
                </button>
            </div>

            <div class="clock-box">
                <p>Jam sekarang</p>
                <h2 id="clock">00:00:00</h2>
                <p id="date"></p>
            </div>
        </section>

        <section id="tasks">
            <h2>Tugas Saya 📚</h2>

            <div class="task-input">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Masukkan tugas baru..."
                >

                <button onclick="addTask()">Tambah</button>
            </div>

            <div id="taskList"></div>
        </section>

        <section id="calculator">
            <h2>Kalkulator Nilai 🧮</h2>

            <div class="calculator">

                <label>Nilai Tugas</label>
                <input type="number" id="assignment">

                <label>Nilai UTS</label>
                <input type="number" id="uts">

                <label>Nilai UAS</label>
                <input type="number" id="uas">

                <button onclick="calculateGrade()">
                    Hitung Nilai
                </button>

                <div id="result"></div>

            </div>
        </section>

    </main>

    <footer>
        <p>Student Hub © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
